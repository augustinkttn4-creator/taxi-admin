<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taxi Dispatch & Operations Admin (Bhopal)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SUPABASE_URL = 'https://gyxpqydqmjzbjqyuucst.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_F500OZGnH0UK82hi1a2N_w_FLCSAT0v';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function AdminApp() {
      const [rides, setRides] = useState([]);
      const [filter, setFilter] = useState('ALL');
      const [loading, setLoading] = useState(true);

      const fetchRides = async () => {
        try {
          const { data, error } = await supabase
            .from('rides')
            .select('*')
            .order('id', { ascending: false })
            .limit(50);
          if (!error && data) setRides(data);
        } catch (e) {
          console.error(e);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchRides();

        // Realtime Listener
        const channel = supabase
          .channel('web-admin-rides')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'rides' }, (payload) => {
            if (payload.eventType === 'INSERT') {
              setRides((prev) => [payload.new, ...prev]);
            } else if (payload.eventType === 'UPDATE') {
              setRides((prev) => prev.map((r) => (r.id === payload.new.id ? payload.new : r)));
            } else if (payload.eventType === 'DELETE') {
              setRides((prev) => prev.filter((r) => r.id === payload.old.id));
            }
          })
          .subscribe();

        const timer = setInterval(fetchRides, 3000);
        return () => {
          clearInterval(timer);
          supabase.removeChannel(channel);
        };
      }, []);

      const handleCancel = async (id) => {
        if (!confirm(`क्या आप राइड #${id} कैंसल करना चाहते हैं?`)) return;
        await supabase.from('rides').update({ status: 'CANCELLED' }).eq('id', id);
      };

      // Metrics
      const totalBookings = rides.length;
      const activeTrips = rides.filter((r) => ['SEARCHING', 'ACCEPTED', 'IN_TRANSIT'].includes(r.status)).length;
      const completedTrips = rides.filter((r) => r.status === 'COMPLETED').length;
      const totalRevenue = rides
        .filter((r) => r.status === 'COMPLETED')
        .reduce((sum, r) => sum + Number(r.fare || 0), 0);

      const filteredRides = rides.filter((r) => {
        if (filter === 'ALL') return true;
        if (filter === 'ACTIVE') return ['SEARCHING', 'ACCEPTED', 'IN_TRANSIT'].includes(r.status);
        return r.status === filter;
      });

      const getBadgeClass = (status) => {
        switch (status) {
          case 'SEARCHING': return 'bg-yellow-500/20 text-yellow-400 border border-yellow-500/40';
          case 'ACCEPTED': return 'bg-blue-500/20 text-blue-400 border border-blue-500/40';
          case 'IN_TRANSIT': return 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40';
          case 'COMPLETED': return 'bg-slate-700 text-slate-300';
          case 'CANCELLED': return 'bg-rose-500/20 text-rose-400 border border-rose-500/40';
          default: return 'bg-slate-700 text-white';
        }
      };

      return (
        <div class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
          {/* Header */}
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-6 border-b border-slate-800">
            <div>
              <h1 class="text-2xl font-bold text-white flex items-center gap-2">
                🚖 Taxi Web Operations Control
              </h1>
              <p class="text-sm text-slate-400">Bhopal Live Dispatch Room (Web Portal)</p>
            </div>
            <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-emerald-500/10 text-emerald-400 text-xs font-semibold border border-emerald-500/30">
              <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              Live Database Connected
            </div>
          </div>

          {/* Stats Grid */}
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 my-6">
            <div class="bg-slate-800/80 p-4 rounded-xl border border-slate-700">
              <span class="text-xs font-medium text-slate-400">TOTAL BOOKINGS</span>
              <p class="text-2xl font-bold text-white mt-1">{totalBookings}</p>
            </div>
            <div class="bg-slate-800/80 p-4 rounded-xl border border-slate-700 border-l-4 border-l-emerald-500">
              <span class="text-xs font-medium text-slate-400">ACTIVE TRIPS</span>
              <p class="text-2xl font-bold text-emerald-400 mt-1">{activeTrips}</p>
            </div>
            <div class="bg-slate-800/80 p-4 rounded-xl border border-slate-700 border-l-4 border-l-blue-500">
              <span class="text-xs font-medium text-slate-400">COMPLETED</span>
              <p class="text-2xl font-bold text-blue-400 mt-1">{completedTrips}</p>
            </div>
            <div class="bg-slate-800/80 p-4 rounded-xl border border-slate-700 border-l-4 border-l-yellow-500">
              <span class="text-xs font-medium text-slate-400">TOTAL REVENUE</span>
              <p class="text-2xl font-bold text-yellow-400 mt-1">₹{totalRevenue}</p>
            </div>
          </div>

          {/* Table Container */}
          <div class="bg-slate-800/90 rounded-xl border border-slate-700 overflow-hidden shadow-xl">
            {/* Filter Buttons */}
            <div class="p-4 border-b border-slate-700 flex flex-wrap gap-2 items-center justify-between">
              <h2 class="font-bold text-base text-white">Live Rides Feed</h2>
              <div class="flex flex-wrap gap-1.5">
                {['ALL', 'ACTIVE', 'SEARCHING', 'ACCEPTED', 'IN_TRANSIT', 'COMPLETED', 'CANCELLED'].map((f) => (
                  <button
                    key={f}
                    onClick={() => setFilter(f)}
                    class={`px-3 py-1 text-xs font-semibold rounded-lg transition-colors ${
                      filter === f ? 'bg-blue-600 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'
                    }`}
                  >
                    {f}
                  </button>
                ))}
              </div>
            </div>

            {/* Table */}
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs sm:text-sm">
                <thead class="bg-slate-900/60 text-slate-400 border-b border-slate-700">
                  <tr>
                    <th class="p-3">ID</th>
                    <th class="p-3">यात्री</th>
                    <th class="p-3">पिकअप स्थान</th>
                    <th class="p-3">ड्रॉप स्थान</th>
                    <th class="p-3">किराया</th>
                    <th class="p-3">OTP</th>
                    <th class="p-3">स्थिति</th>
                    <th class="p-3 text-right">कार्रवाई</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-700/60">
                  {loading ? (
                    <tr>
                      <td colSpan="8" class="text-center p-8 text-slate-400">डेटा लोड हो रहा है...</td>
                    </tr>
                  ) : filteredRides.length === 0 ? (
                    <tr>
                      <td colSpan="8" class="text-center p-8 text-slate-400">कोई राइड नहीं मिली।</td>
                    </tr>
                  ) : (
                    filteredRides.map((ride) => (
                      <tr key={ride.id} class="hover:bg-slate-750 transition-colors">
                        <td class="p-3 font-semibold text-slate-300">#{ride.id}</td>
                        <td class="p-3 font-medium text-white">{ride.passenger_name || 'यात्री'}</td>
                        <td class="p-3 max-w-xs truncate text-slate-300" title={ride.pickup_address}>
                          {ride.pickup_address}
                        </td>
                        <td class="p-3 max-w-xs truncate text-slate-300" title={ride.drop_address}>
                          {ride.drop_address}
                        </td>
                        <td class="p-3 font-bold text-yellow-400">₹{ride.fare}</td>
                        <td class="p-3 font-mono font-bold text-sky-400">{ride.otp || '----'}</td>
                        <td class="p-3">
                          <span class={`inline-block px-2.5 py-0.5 rounded-full text-xs font-bold ${getBadgeClass(ride.status)}`}>
                            {ride.status}
                          </span>
                        </td>
                        <td class="p-3 text-right">
                          {['SEARCHING', 'ACCEPTED'].includes(ride.status) && (
                            <button
                              onClick={() => handleCancel(ride.id)}
                              class="px-2.5 py-1 text-xs font-semibold bg-rose-500/20 text-rose-400 border border-rose-500/40 rounded-lg hover:bg-rose-500/40 transition-colors"
                            >
                              रद्द करें
                            </button>
                          )}
                        </td>
                      </tr>
                    ))
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AdminApp />);
  </script>
</body>
</html>
